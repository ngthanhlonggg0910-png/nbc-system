services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: nbc-backend
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      NODE_ENV: production
      PORT: 3001
    ports:
      - "3001:3001"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: nbc-frontend
    restart: unless-stopped
    ports:
      - "5173:80"
    depends_on:
      - backend
